  <meta charset="UTF-8">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">

  <title>zaiki_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      window.addEventListener('load', async function () {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((r) => r.unregister()));
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
          }
        } catch (_) {}
      });
    })();
  </script>
  <script>
    // Service Worker registration can fail with
    // "InvalidStateError: ... document is in an invalid state" when the app
    // is running inside a sandboxed preview (e.g. VS Code's embedded Web
    // view). This is harmless — it only disables the offline caching
    // worker — so we swallow just that specific error to avoid noisy
    // error toasts/logs in such environments.
    (function () {
      function isServiceWorkerRegistrationError(message) {
        return typeof message === 'string' &&
          message.indexOf('register a ServiceWorker') !== -1;
      }
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var message = reason && reason.message ? reason.message : String(reason);
        if (isServiceWorkerRegistrationError(message)) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        if (isServiceWorkerRegistrationError(event.message)) {
          event.preventDefault();
        }
      }, true);
    })();
  </script>

  <!--

  <script src="flutter_bootstrap.js" async></script>
</body>
